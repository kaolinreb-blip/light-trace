<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>光の筆 ／ Light Painting</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400&family=Zen+Kaku+Gothic+New:wght@400&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#03060f; --glow:#7fd8e8; --moon:#e8f1ff; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--ink)}
  body{font-family:"Zen Kaku Gothic New",-apple-system,sans-serif;color:var(--moon);
       -webkit-tap-highlight-color:transparent;touch-action:none}
  #stage{position:fixed;inset:0;display:block;cursor:crosshair}

  #title{position:fixed;left:0;right:0;top:44%;text-align:center;
         pointer-events:none;transition:opacity 1.8s ease}
  #title h1{font-family:"Shippori Mincho",serif;font-size:clamp(28px,6vw,52px);
            letter-spacing:.36em;text-indent:.36em;
            text-shadow:0 0 38px rgba(127,216,232,.55)}
  #title p{margin-top:1.5em;font-size:13px;letter-spacing:.2em;
           color:rgba(232,241,255,.66)}
  #title.hidden{opacity:0}

  #panel{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));
         transform:translateX(-50%);display:flex;gap:6px;align-items:center;
         padding:6px;border-radius:999px;background:rgba(6,16,38,.6);
         border:1px solid rgba(127,216,232,.18);backdrop-filter:blur(14px);
         opacity:.32;transition:opacity .4s ease;
         max-width:calc(100vw - 20px);overflow-x:auto;scrollbar-width:none}
  #panel::-webkit-scrollbar{display:none}
  @media (max-width:620px){ #status{display:none} }
  #panel:hover,#panel:focus-within{opacity:1}
  button{font-family:inherit;font-size:12px;letter-spacing:.12em;color:var(--moon);
         background:transparent;border:0;border-radius:999px;padding:9px 15px;cursor:pointer;
         transition:background .25s ease,color .25s ease;white-space:nowrap}
  button:hover{background:rgba(127,216,232,.15)}
  button:focus-visible{outline:2px solid var(--glow);outline-offset:2px}
  button[aria-pressed="true"]{background:var(--glow);color:var(--ink)}
  #status{padding:0 12px 0 8px;font-size:11px;letter-spacing:.1em;
          color:rgba(232,241,255,.5);white-space:nowrap}
  .sep{width:1px;height:18px;background:rgba(127,216,232,.2)}
  #bgFile{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
  #toast{position:fixed;left:50%;bottom:74px;transform:translateX(-50%);
         padding:9px 16px;border-radius:999px;font-size:12px;letter-spacing:.08em;
         background:rgba(6,16,38,.9);border:1px solid rgba(127,216,232,.3);
         color:var(--moon);opacity:0;transition:opacity .3s ease;pointer-events:none;
         white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis}
  #toast.on{opacity:1}

  #cam{position:fixed;right:14px;top:14px;width:96px;border-radius:10px;
       transform:scaleX(-1);opacity:0;transition:opacity .5s ease;
       border:1px solid rgba(127,216,232,.25);pointer-events:none}
  #cam.on{opacity:.26}
</style>
</head>
<body>

<canvas id="stage"></canvas>
<video id="cam" playsinline muted></video>

<div id="title">
  <h1>光の筆</h1>
  <p>押しながら動かすと、光が残ります</p>
</div>

<div id="toast"></div>

<div id="panel">
  <span id="status">押しながら描いてください</span>
  <button id="camBtn" aria-pressed="false">カメラで描く</button>
  <span class="sep"></span>
  <button id="brushBtn">筆：リボン</button>
  <button id="paletteBtn">色：青</button>
  <button id="thickBtn">太さ：中</button>
  <button id="bgBtn">背景</button>
  <button id="fitBtn">表示：自動</button>
  <input type="file" id="bgFile" accept="image/*,video/*">
  <button id="clearBgBtn">背景なし</button>
  <button id="saveBtn">この一枚を保存</button>
  <button id="clearBtn">はじめから</button>
</div>

<script type="module">
/* ══════════════════════════════════════════════════════════
   ここを変えると雰囲気が変わります
   ══════════════════════════════════════════════════════════ */
const FIT  = 'auto';   // 'auto' / 'cover'(画面いっぱい) / 'contain'(絵の全体)
const VEIL = 0.30;     // 背景を落とす強さ。0 にすると絵そのままの明るさ
const SHOW_TITLE = false;  // 大きなタイトルを出すか
const SHOW_HINT  = true;   // 小さな案内文を出すか（最初だけ表示され、描き始めると消えます）
const SIGNATURE   = '© Linaly';
const SIGN_ALWAYS = true;
const SHOW_CAMERA_PREVIEW = true;
const FADE = 0;          // 描いている間に薄れる速さ。0 = 描いた光はそのまま残る
const REST_AFTER = 30000; // 誰も触らなくなってから、消え始めるまで（ミリ秒）
const REST_RATE  = 0.014; // 消えていく速さ。大きいほど早い
const HUE_DRIFT = 0.06; // 描きながら色が移っていく速さ

if(!SHOW_TITLE) document.querySelector('#title h1').style.display='none';
if(!SHOW_HINT)  document.querySelector('#title p').style.display='none';

const cv=document.getElementById('stage');
const ctx=cv.getContext('2d',{alpha:false});
const titleEl=document.getElementById('title');
const statusEl=document.getElementById('status');
const video=document.getElementById('cam');

/* 光を溜めておく、消えないキャンバス */
const trace=document.createElement('canvas');
const tctx=trace.getContext('2d');

let W=0,H=0,DPR=1,MAXDPR=2,LOW=false;
function resize(){
  const keep=document.createElement('canvas');
  if(trace.width){ keep.width=trace.width; keep.height=trace.height;
                   keep.getContext('2d').drawImage(trace,0,0); }
  DPR=Math.min(devicePixelRatio||1,MAXDPR);
  W=innerWidth; H=innerHeight;
  cv.width=W*DPR; cv.height=H*DPR;
  cv.style.width=W+'px'; cv.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  trace.width=W*DPR; trace.height=H*DPR;
  tctx.setTransform(DPR,0,0,DPR,0,0);
  if(keep.width) tctx.drawImage(keep,0,0,keep.width/DPR,keep.height/DPR);
  tctx.lineCap='round'; tctx.lineJoin='round';
}
resize();
addEventListener('resize',resize);

const rand=(a,b)=>a+Math.random()*(b-a);
const lerp=(a,b,t)=>a+(b-a)*t;

/* ── 手の位置 ────────────────────────────────────────── */
const hand={x:W/2,y:H/2,px:W/2,py:H/2,speed:0,down:false,lastInput:0,has:false};
function feed(x,y,down){
  // しばらくぶりに人が来たら、まっさらにしてから始める
  if(hand.lastInput && performance.now()-hand.lastInput>REST_AFTER){
    tctx.clearRect(0,0,W,H); sparks.length=0;
  }
  if(!hand.has){ hand.px=x; hand.py=y; hand.has=true; }
  hand.x=x; hand.y=y; hand.down=down;
  hand.lastInput=performance.now();
  titleEl.classList.add('hidden');
}
addEventListener('pointerdown',e=>{ if(!camOn){ hand.has=false; feed(e.clientX,e.clientY,true); }});
addEventListener('pointermove',e=>{ if(!camOn) feed(e.clientX,e.clientY,e.buttons>0||e.pointerType==='touch'); });
addEventListener('pointerup',  ()=>{ if(!camOn){ hand.down=false; hand.has=false; }});
addEventListener('pointerleave',()=>{ if(!camOn){ hand.down=false; hand.has=false; }});

/* ── 筆と色 ──────────────────────────────────────────── */
const PALETTES={
  blue : {name:'青',    home:196, min:176, max:284, sat:90, drift:1.0},
  neon : {name:'ネオン', home:352, min:300, max:430, sat:98, drift:1.9},
  gold : {name:'金',    home:42,  min:28,  max:58,  sat:84, drift:0.5}
};
const ORDER=['blue','neon','gold'];
let palette='blue', hue=PALETTES.blue.home, hueDir=1;
let brush='line';   // 'line' か 'ribbon'

/* 線の太さ */
const THICKS=[{n:'細',v:.5},{n:'中',v:1},{n:'太',v:1.8},{n:'極太',v:3}];
let thickIdx=1;
const TH=()=>THICKS[thickIdx].v;
const thickBtn=document.getElementById('thickBtn');
thickBtn.addEventListener('click',()=>{
  thickIdx=(thickIdx+1)%THICKS.length;
  thickBtn.textContent='太さ：'+THICKS[thickIdx].n;
});

const brushBtn=document.getElementById('brushBtn');
const paletteBtn=document.getElementById('paletteBtn');
brushBtn.addEventListener('click',()=>{
  brush = brush==='line' ? 'ribbon' : 'line';
  brushBtn.textContent = brush==='line' ? '筆：リボン' : '筆：線';
});
paletteBtn.addEventListener('click',()=>{
  palette = ORDER[(ORDER.indexOf(palette)+1)%ORDER.length];
  hue=PALETTES[palette].home; hueDir=1;
  paletteBtn.textContent = '色：'+PALETTES[palette].name;
});
paletteBtn.textContent='色：'+PALETTES[palette].name;

/* ── 背景の絵 ────────────────────────────────────────── */

let bgImage=null, lastVideoError='';
function loadVideo(src,local){
  return new Promise(res=>{
    const v=document.createElement('video');
    v.muted=true; v.loop=true; v.playsInline=true; v.autoplay=true;
    if(!local) v.crossOrigin='anonymous';
    let done=false;
    const ok=()=>{
      if(done) return;
      if(!v.videoWidth) return;      // 大きさがわかってから採用する
      done=true; v.play().catch(()=>{}); res(v);
    };
    v.onloadedmetadata=ok; v.onloadeddata=ok; v.oncanplay=ok;
    v.onerror=()=>{ if(!done){ done=true; lastVideoError=v.error?('code '+v.error.code):'不明'; res(null); } };
    setTimeout(()=>{ if(!done){ done=true; lastVideoError='時間切れ'; res(null); } },
               src.startsWith('data:')||src.startsWith('blob:') ? 12000 : 2500);
    v.src=src; v.load();
  });
}
function loadImage(src,local){
  return new Promise(res=>{
    const im=new Image();
    if(!local) im.crossOrigin='anonymous';
    im.onload=()=>res(im); im.onerror=()=>res(null); im.src=src;
  });
}
/* 端末の中のファイルを、そのままデータとして読む方法（制限の強い環境向け） */
function fileToDataURL(f){
  return new Promise(res=>{
    const r=new FileReader();
    r.onload=()=>res(r.result); r.onerror=()=>res(null);
    r.readAsDataURL(f);
  });
}
/* index.html と同じ場所に bg.mp4 を置くと、それが背景になります。
   無ければ、ファイルに埋め込んである絵を使います。 */
let userChoseBg=false;      // 自分で選んだら、自動読み込みは手を出さない
(async function initBackground(){
  const v=await loadVideo('bg.mp4');
  if(userChoseBg) return;
  if(v){ bgImage=v; return; }
  const im=await loadImage(EMBEDDED_BG);
  if(!userChoseBg&&im) bgImage=im;
})();
const toastEl=document.getElementById('toast');
let toastTimer=null;
function toast(msg){
  toastEl.textContent=msg; toastEl.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>toastEl.classList.remove('on'),2600);
}

const FITS=[{k:'auto',n:'自動'},{k:'contain',n:'絵の全体'},{k:'cover',n:'画面いっぱい'}];
let fitIdx=0;
const fitBtn=document.getElementById('fitBtn');
fitBtn.addEventListener('click',()=>{
  fitIdx=(fitIdx+1)%FITS.length;
  fitBtn.textContent='表示：'+FITS[fitIdx].n;
});

const bgFile=document.getElementById('bgFile');
document.getElementById('bgBtn').addEventListener('click',()=>{ bgFile.click(); });

bgFile.addEventListener('change',async e=>{
  const f=e.target.files&&e.target.files[0];
  if(!f){ toast('ファイルが選ばれませんでした'); return; }
  userChoseBg=true;
  toast('読み込み中…');
  const isVideo = f.type.startsWith('video') || /\.(mp4|mov|webm|m4v)$/i.test(f.name);
  const load = src => isVideo ? loadVideo(src,true) : loadImage(src,true);

  // まず通常の方法、だめならデータとして直接読む
  let media=null;
  try{ media = await load(URL.createObjectURL(f)); }catch{}
  if(!media){
    const data=await fileToDataURL(f);
    if(data){ try{ media = await load(data); }catch{} }
  }

  if(media){
    if(bgImage&&bgImage.pause) bgImage.pause();
    bgImage=media;
    titleEl.classList.add('hidden');
    toast(isVideo?'動画を背景にしました':'背景を変えました');
  }else{
    toast('読み込めません：'+(f.type||f.name)+(isVideo&&lastVideoError?'／'+lastVideoError:''));
  }
  bgFile.value='';   // 同じファイルをもう一度選べるように
});
document.getElementById('clearBgBtn').addEventListener('click',()=>{
  userChoseBg=true;
  if(bgImage&&bgImage.pause) bgImage.pause();
  bgImage=null;
});

function drawBackground(t){
  if(!bgImage){
    const g=ctx.createRadialGradient(W*.5,H*.45,0,W*.5,H*.5,Math.max(W,H)*.75);
    g.addColorStop(0,'#0a1430'); g.addColorStop(.6,'#050b1e'); g.addColorStop(1,'#03060f');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H); return;
  }
  ctx.fillStyle='#03060f'; ctx.fillRect(0,0,W,H);
  const bw=bgImage.videoWidth||bgImage.width;
  const bh=bgImage.videoHeight||bgImage.height;
  if(!bw||!bh) return;

  let mode=FITS[fitIdx].k;
  if(mode==='auto') mode='cover';
  if(FITS[fitIdx].k==='auto'||FIT==='auto'){
    // 縦横の比率が大きく違うときは、絵を切らずに全体を見せる
    const ra=(W/H)/(bw/bh);
    mode=(ra>1.35||ra<0.74) ? 'contain' : 'cover';
  }

  let sc, drift;
  if(mode==='contain'){
    sc=Math.min(W/bw,H/bh); drift=0;             // 全体を見せる。拡大しないので画質が保たれる
  }else{
    sc=Math.max(W/bw,H/bh)*(1.04+Math.sin(t*.00006)*.02); drift=Math.sin(t*.00004)*16;
  }
  const w=bw*sc, h=bh*sc;
  ctx.drawImage(bgImage,(W-w)/2+drift,(H-h)/2,w,h);

  if(VEIL>0){ ctx.fillStyle=`rgba(3,6,15,${VEIL})`; ctx.fillRect(0,0,W,H); }
}

/* 色は決めた範囲の中を、行ったり来たりしながら移ろう */
function driftHue(mul){
  const P=PALETTES[palette];
  hue += HUE_DRIFT*P.drift*hueDir*(mul??1);
  if(hue>P.max){ hue=P.max; hueDir=-1; }
  if(hue<P.min){ hue=P.min; hueDir=1; }
}

/* ── 光の線を引く ────────────────────────────────────── */
function stroke(x0,y0,x1,y1,speed){
  if(brush==='ribbon') return ribbon(x0,y0,x1,y1,speed);
  return line(x0,y0,x1,y1,speed);
}

/* リボン：光源が一本の棒になっているときの軌跡。中に細かい縞が出る */
function ribbon(x0,y0,x1,y1,speed){
  const dx=x1-x0, dy=y1-y0, len=Math.hypot(dx,dy)||1;
  const nx=-dy/len, ny=dx/len;                 // 進行方向と直角
  const halfW=lerp(22,13,Math.min(speed/30,1))*TH();
  const N=LOW?5:9;
  const P=PALETTES[palette];
  tctx.globalCompositeOperation='lighter';
  // まわりのにじみ
  tctx.lineWidth=halfW*2.7;
  tctx.strokeStyle=`hsla(${hue},${P.sat}%,54%,.045)`;
  tctx.beginPath(); tctx.moveTo(x0,y0); tctx.lineTo(x1,y1); tctx.stroke();
  // 縞
  for(let i=0;i<N;i++){
    const t=(i/(N-1))*2-1, edge=Math.abs(t), off=t*halfW;
    tctx.lineWidth=lerp(2.8,1.1,edge)*Math.max(1,TH()*.7);
    tctx.strokeStyle=`hsla(${hue+t*12},${P.sat}%,${lerp(95,56,edge)}%,${lerp(.82,.3,edge)})`;
    tctx.beginPath();
    tctx.moveTo(x0+nx*off,y0+ny*off);
    tctx.lineTo(x1+nx*off,y1+ny*off);
    tctx.stroke();
  }
  tctx.globalCompositeOperation='source-over';
}

function line(x0,y0,x1,y1,speed){
  const w=lerp(9,2.2,Math.min(speed/26,1))*TH();   // 速いほど細く、光が薄くなる
  tctx.globalCompositeOperation='lighter';
  const P=PALETTES[palette];
  const layers=LOW
    ? [[w*2.0,.16],[w,.85]]
    : [[w*3.4,.075],[w*1.8,.15],[w,.9]];
  for(const [lw,al] of layers){
    tctx.lineWidth=lw;
    tctx.strokeStyle = al>.5
      ? `hsla(${hue},70%,93%,${al})`          // 芯は白に近い
      : `hsla(${hue},${P.sat}%,62%,${al})`;   // まわりは色
    tctx.beginPath(); tctx.moveTo(x0,y0); tctx.lineTo(x1,y1); tctx.stroke();
  }
  tctx.globalCompositeOperation='source-over';
}

/* こぼれる火花（これは残らない） */
const sparks=[];
function spark(x,y,vx,vy){
  if(sparks.length>140) sparks.shift();
  sparks.push({x,y,vx:vx*.28+rand(-.7,.7),vy:vy*.28+rand(-.7,.7),
               life:1,decay:rand(.012,.03),r:rand(.8,2.2),h:hue});
}

/* ── カメラ ──────────────────────────────────────────── */
let camOn=false,landmarker=null,lastVideoTime=-1,lastHandSeen=0;
const camBtn=document.getElementById('camBtn');
camBtn.addEventListener('click',async()=>{
  if(camOn){ stopCam(); return; }
  statusEl.textContent='カメラを準備中…';
  try{
    const {HandLandmarker,FilesetResolver}=
      await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14');
    if(!landmarker){
      const files=await FilesetResolver.forVisionTasks(
        'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
      const model='https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task';
      try{
        landmarker=await HandLandmarker.createFromOptions(files,{
          baseOptions:{modelAssetPath:model,delegate:'GPU'},runningMode:'VIDEO',numHands:1});
      }catch{
        landmarker=await HandLandmarker.createFromOptions(files,{
          baseOptions:{modelAssetPath:model,delegate:'CPU'},runningMode:'VIDEO',numHands:1});
      }
    }
    const stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:'user',width:{ideal:480},height:{ideal:360},frameRate:{ideal:24}}});
    video.srcObject=stream; await video.play();
    camOn=true; camBtn.setAttribute('aria-pressed','true');
    hand.has=false; lastHandSeen=0;
    statusEl.textContent='人差し指を立てて描いてください';
  }catch(err){
    statusEl.textContent='カメラを使えません。指で描けます'; console.warn(err);
  }
});
function stopCam(){
  camOn=false; camBtn.setAttribute('aria-pressed','false');
  video.classList.remove('on');
  (video.srcObject?.getTracks()||[]).forEach(t=>t.stop());
  video.srcObject=null; hand.down=false; hand.has=false;
  statusEl.textContent='押しながら描いてください';
}
function readHand(now){
  if(!camOn||!landmarker||video.readyState<2) return;
  if(LOW&&(frameNo&1)) return;
  if(video.currentTime===lastVideoTime) return;
  lastVideoTime=video.currentTime;
  let res; try{ res=landmarker.detectForVideo(video,now); }catch{ return; }
  const lm=res?.landmarks?.[0];
  if(!lm){ hand.down=false; hand.has=false; return; }
  lastHandSeen=now;
  // 人差し指が伸びているときだけ描く（握ると筆を離せる）
  const up = lm[8].y < lm[6].y - 0.02;
  feed((1-lm[8].x)*W, lm[8].y*H, up);
}
function updatePreview(now){
  if(!camOn||!SHOW_CAMERA_PREVIEW){ video.classList.remove('on'); return; }
  const gap=now-lastHandSeen;
  video.classList.toggle('on', gap>1600&&gap<9000);
}

/* ── 署名 ────────────────────────────────────────────── */
function stampSignature(op){
  const pad=Math.max(14,Math.round(Math.min(W,H)*.028));
  ctx.save();
  ctx.globalAlpha=op??1;
  ctx.font=`${Math.max(11,Math.round(Math.min(W,H)*.019))}px "Zen Kaku Gothic New",sans-serif`;
  ctx.textAlign='right'; ctx.textBaseline='bottom';
  ctx.shadowBlur=6; ctx.shadowColor='rgba(0,0,0,.6)';
  ctx.fillStyle='rgba(232,241,255,.66)';
  ctx.fillText(SIGNATURE, W-pad, H-pad);
  ctx.restore();
}

/* ── ループ ──────────────────────────────────────────── */
let frameNo=0,lastT=0,fpsSum=0,fpsN=0,idlePhase=rand(0,100);
function checkSpeed(now){
  if(LOW||!lastT){ lastT=now; return; }
  const dt=now-lastT; lastT=now;
  if(dt>0&&dt<400){ fpsSum+=1000/dt; fpsN++; }
  if(fpsN>=90){ if(fpsSum/fpsN<38){ LOW=true; MAXDPR=1; resize(); } fpsSum=0; fpsN=0; }
}

function frame(now){
  frameNo++;
  checkSpeed(now);
  readHand(now);
  updatePreview(now);

  const idle=now-hand.lastInput>36000;
  if(idle){
    idlePhase+=.008;
    const nx=W/2+Math.cos(idlePhase*1.0)*W*.32;
    const ny=H/2+Math.sin(idlePhase*1.53)*H*.30;
    hand.px=hand.x; hand.py=hand.y;
    hand.x=nx; hand.y=ny; hand.down=true; hand.has=true;
    driftHue(.6);
  }

  hand.speed=Math.hypot(hand.x-hand.px,hand.y-hand.py);

  if(hand.down&&hand.has&&hand.speed<260){
    stroke(hand.px,hand.py,hand.x,hand.y,hand.speed);
    driftHue();
    if(!LOW&&hand.speed>4&&Math.random()<.35)
      spark(hand.x,hand.y,hand.x-hand.px,hand.y-hand.py);
  }
  hand.px=hand.x; hand.py=hand.y;

  // 誰も触っていない間だけ、光をゆっくり返していく
  const resting = now-hand.lastInput > REST_AFTER;
  const rate = resting ? REST_RATE : FADE;
  if(rate>0&&frameNo%3===0){
    tctx.globalCompositeOperation='destination-out';
    tctx.fillStyle=`rgba(0,0,0,${rate})`;
    tctx.fillRect(0,0,W,H);
    tctx.globalCompositeOperation='source-over';
  }

  // ── 描画 ──
  drawBackground(now);
  ctx.drawImage(trace,0,0,W,H);

  for(let i=sparks.length-1;i>=0;i--){
    const s=sparks[i];
    s.x+=s.vx; s.y+=s.vy; s.vy+=.02; s.vx*=.985; s.vy*=.985;
    s.life-=s.decay;
    if(s.life<=0){ sparks.splice(i,1); continue; }
    ctx.globalAlpha=s.life*.8;
    ctx.fillStyle=`hsla(${s.h},85%,80%,1)`;
    ctx.beginPath(); ctx.arc(s.x,s.y,s.r*s.life,0,6.3); ctx.fill();
  }
  ctx.globalAlpha=1;

  // 筆先
  if(hand.has&&!idle){
    const r=hand.down?16:9;
    const t=ctx.createRadialGradient(hand.x,hand.y,0,hand.x,hand.y,r);
    t.addColorStop(0,`hsla(${hue},60%,96%,${hand.down?.75:.35})`);
    t.addColorStop(1,`hsla(${hue},90%,60%,0)`);
    ctx.fillStyle=t; ctx.beginPath(); ctx.arc(hand.x,hand.y,r,0,6.3); ctx.fill();
  }

  if(SIGN_ALWAYS) stampSignature(.42);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ── 保存 / リセット / 展示モード ────────────────────── */
document.getElementById('saveBtn').addEventListener('click',()=>{
  try{
    stampSignature(1);
    const a=document.createElement('a');
    a.download=`hikari_${Date.now()}.png`;
    a.href=cv.toDataURL('image/png'); a.click();
    statusEl.textContent='保存しました';
  }catch{ statusEl.textContent='保存できませんでした'; }
  setTimeout(()=>{ statusEl.textContent=camOn?'人差し指を立てて描いてください':'押しながら描いてください'; },2400);
});
document.getElementById('clearBtn').addEventListener('click',()=>{
  tctx.clearRect(0,0,W,H); sparks.length=0;
  titleEl.classList.remove('hidden');
  hand.lastInput=performance.now();
});
if(location.search.includes('kiosk')) document.getElementById('panel').style.display='none';
</script>
</body>
